name: CI Pipeline - Automated Testing & Retrieval Evaluation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: aidb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: aidb
      OLLAMA_BASE_URL: http://localhost:11434

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Cache HuggingFace Transformer Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: \({{ runner.os }}-hf-\){{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Initialize Database Schema (pgvector)
        run: |
          python -c "
          import psycopg2, os
          conn = psycopg2.connect(
              host=os.getenv('DB_HOST', 'localhost'),
              port=os.getenv('DB_PORT', '5432'),
              dbname=os.getenv('DB_NAME', 'aidb'),
              user=os.getenv('DB_USER', 'postgres'),
              password=os.getenv('DB_PASSWORD', 'password')
          )
          cursor = conn.cursor()
          cursor.execute('CREATE EXTENSION IF NOT EXISTS vector;')
          cursor.execute('''
              CREATE TABLE IF NOT EXISTS document_chunks (
                  id SERIAL PRIMARY KEY,
                  chunk_text TEXT NOT NULL,
                  source_file VARCHAR(255) NOT NULL,
                  page_number INT NOT NULL,
                  embedding vector(384)
              );
          ''')
          conn.commit()
          cursor.close()
          conn.close()
          print('Database schema initialized successfully!')
          "

      - name: Run Automated Backend Unit Tests (pytest)
        run: |
          pytest test_app.py -v --cov=app --cov-report=term-missing

      - name: Seed Sample Vector Chunks for CI Evaluation
        run: |
          python -c "
          import psycopg2, os
          from sentence_transformers import SentenceTransformer

          model = SentenceTransformer('all-MiniLM-L6-v2')
          sample_text = 'This air-gapped hybrid RAG system utilizes PostgreSQL pgvector, BM25 keyword matching, Reciprocal Rank Fusion, and Cross-Encoder reranking for robust document retrieval.'
          embedding = model.encode(sample_text).tolist()

          conn = psycopg2.connect(
              host=os.getenv('DB_HOST', 'localhost'),
              port=os.getenv('DB_PORT', '5432'),
              dbname=os.getenv('DB_NAME', 'aidb'),
              user=os.getenv('DB_USER', 'postgres'),
              password=os.getenv('DB_PASSWORD', 'password')
          )
          cursor = conn.cursor()
          cursor.execute(
              '''
              INSERT INTO document_chunks (chunk_text, source_file, page_number, embedding)
              VALUES (%s, %s, %s, %s::vector);
              ''',
              (sample_text, 'ci_benchmark_manual.pdf', 1, str(embedding))
          )
          conn.commit()
          cursor.close()
          conn.close()
          print('CI benchmark chunk seeded successfully!')
          "

      - name: Run Quantitative Retrieval Evaluation
        run: |
          python evaluate_retrieval.py

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation-report
          path: |
            evaluation_report.csv
            *.log
          retention-days: 14